[project]
name = "b1nary-market-maker"
version = "0.1.0"
description = "Standalone market maker client for the b1nary options protocol"
requires-python = ">=3.12"
dependencies = [
    "eth-account>=0.13",
    "eth-abi>=5",
    "web3>=7",
    "numpy>=2.0",
    "scipy>=1.14",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "websocket-client>=1.7",
    "hyperliquid-python-sdk>=0.22.0",
    "supabase>=2.0",
    "solders>=0.21",
    "base58>=2.1",
    "pynacl>=1.5",
    "websockets>=13,<14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "ruff==0.15.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".worktrees", "dist"]
markers = [
    "integration: requires a controlled external service or process",
    "network: requires explicit network access and credentials",
]

[tool.ruff]
extend-exclude = [".worktrees", ".venv", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
